<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 128" width="320" height="128">
  <!--
    Tabliczka pod licznik cukierków w HUD (lewy górny róg): z lewej okrągłe wybrzuszenie
    na ikonę cukierka (64 px), z prawej wstążka na cyfry. Gra pokazuje ją w 160×64 px.
    Kremowa, z ciemnym konturem, miękkim cieniem pod spodem, blikiem wzdłuż górnej
    krawędzi i lekko wgłębionym krążkiem pod ikoną („gniazdo na monetę").
    Jedna ścieżka (koło + zaokrąglona wstążka), żeby kontur był czysty na styku.
    Kontur 6 (3 px w grze). Wstążka ma 44 px wysokości w grze — cyfry 60 px lekko
    wystają poza nią (jak naklejki); jeśli ma je objąć, podaj je w skali ~0.7.
    Paleta i grubości konturu: docs/Styleguide_Wektorowy.md
  -->
  <defs>
    <linearGradient id="ui_candy_counter_bg_fill" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#F7F0E3"/>
      <stop offset="0.55" stop-color="#F7F0E3"/>
      <stop offset="1" stop-color="#EFD6B2"/>
    </linearGradient>
    <filter id="ui_candy_counter_bg_blur" x="-10%" y="-20%" width="120%" height="140%">
      <feGaussianBlur stdDeviation="2.5"/>
    </filter>
    <filter id="ui_candy_counter_bg_grain" x="0" y="0" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency="0.85" numOctaves="3" stitchTiles="stitch"/>
      <feColorMatrix type="saturate" values="0"/>
    </filter>
    <clipPath id="ui_candy_counter_bg_shape">
      <path d="M97,20 L284,20 A24,24 0 0 1 308,44 L308,84 A24,24 0 0 1 284,108 L97,108 A55,55 0 1 1 97,20 Z"/>
    </clipPath>
  </defs>

  <!-- cień pod tabliczką -->
  <path d="M97,20 L284,20 A24,24 0 0 1 308,44 L308,84 A24,24 0 0 1 284,108 L97,108 A55,55 0 1 1 97,20 Z"
        fill="#14284F" opacity="0.5" transform="translate(0 4)" filter="url(#ui_candy_counter_bg_blur)"/>

  <g stroke="#4A3226" stroke-width="6" stroke-linejoin="round" stroke-linecap="round">
    <!-- tabliczka: koło na ikonę + wstążka na cyfry -->
    <path d="M97,20 L284,20 A24,24 0 0 1 308,44 L308,84 A24,24 0 0 1 284,108 L97,108 A55,55 0 1 1 97,20 Z"
          fill="url(#ui_candy_counter_bg_fill)"/>
    <!-- wgłębiony krążek pod ikonę cukierka -->
    <circle cx="64" cy="64" r="42" fill="#EFD6B2" fill-opacity="0.75" stroke-width="3" stroke-opacity="0.3"/>
    <!-- blik wzdłuż górnej krawędzi i cień wzdłuż dolnej -->
    <path d="M22,44 A47,47 0 0 1 56,21" fill="none" stroke="#FFFFFF" stroke-width="4" stroke-opacity="0.55"/>
    <path d="M118,28 L282,28" fill="none" stroke="#FFFFFF" stroke-width="4" stroke-opacity="0.55"/>
    <path d="M122,100 L284,100" fill="none" stroke="#4A3226" stroke-width="4" stroke-opacity="0.1"/>
  </g>

  <!-- ziarno papieru — tylko na tabliczce -->
  <rect width="320" height="128" filter="url(#ui_candy_counter_bg_grain)" clip-path="url(#ui_candy_counter_bg_shape)" opacity="0.12" style="mix-blend-mode:multiply"/>
</svg>
