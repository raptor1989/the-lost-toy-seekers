<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 56 28" width="56" height="28">
  <!--
    Podstawka dźwigni (Dokumentacja 3.5). 28×14 px w grze, zaczepiona u dołu
    (origin 0.5/1) — dół jest płaski, bo stoi na podłodze. Drążek
    (`world_lever_handle`) gra rysuje ZA podstawką, z osią obrotu 2 px nad jej
    górną krawędzią, dlatego pośrodku jest złoty uchwyt-łożysko, który „trzyma" oś:
    sięga prawie do górnej krawędzi pliku, żeby zakryć koniec drążka.
    Drewniany klocek z jaśniejszą górną ścianką i dwoma ciemnymi kołkami.
  -->
  <defs>
    <linearGradient id="lbase_body" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#C89257"/>
      <stop offset="1" stop-color="#A8743F"/>
    </linearGradient>
  </defs>
  <g stroke="#4A3226" stroke-width="3" stroke-linejoin="round" stroke-linecap="round">
    <!-- korpus -->
    <rect x="2.5" y="6" width="51" height="20.5" rx="5" fill="url(#lbase_body)"/>
    <!-- górna ścianka -->
    <path d="M7.5,6 H48.5 Q53.5,6 53.5,11 V12.5 H2.5 V11 Q2.5,6 7.5,6 Z" fill="#DCA96D" stroke="none"/>
    <path d="M2.5,12.5 H53.5" fill="none" stroke-width="2" stroke-opacity="0.55"/>
    <!-- kołki -->
    <circle cx="10" cy="19.5" r="2.2" fill="#4A3226" stroke="none"/>
    <circle cx="46" cy="19.5" r="2.2" fill="#4A3226" stroke="none"/>
    <!-- złoty uchwyt osi -->
    <path d="M20.5,17 V10 A7.5,7.5 0 0 1 35.5,10 V17 Z" fill="#D9A440" stroke-width="2.5"/>
    <path d="M23.5,9.5 A4.5,4.5 0 0 1 30,6.5" fill="none" stroke="#F2C94C" stroke-width="1.8" stroke-opacity="0.9"/>
    <circle cx="28" cy="10" r="2.2" fill="#4A3226" stroke="none"/>
  </g>
</svg>
