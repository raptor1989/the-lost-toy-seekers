<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <!--
    Brokat — cząsteczka „puf" po duszku, posypka przy zdobyciu cukierka, powrót klocka.
    Bez konturu: przy 32 px kontur zjadłby kształt, a cząsteczka ma być błyskiem,
    nie obiektem. Miękka poświata pod gwiazdką — brokat ma „świecić" na granacie.
  -->
  <defs>
    <radialGradient id="sparkle_glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#FFF2B2" stop-opacity="0.6"/>
      <stop offset="1" stop-color="#FFD166" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <circle cx="32" cy="32" r="31" fill="url(#sparkle_glow)"/>
  <path d="M32,4 C35,24 40,29 60,32 C40,35 35,40 32,60 C29,40 24,35 4,32 C24,29 29,24 32,4 Z" fill="#FFD166"/>
  <path d="M32,14 C34,26 38,30 50,32 C38,34 34,38 32,50 C30,38 26,34 14,32 C26,30 30,26 32,14 Z" fill="#FFF2B2"/>
  <circle cx="32" cy="32" r="5" fill="#FFFFFF" opacity="0.9"/>
</svg>
