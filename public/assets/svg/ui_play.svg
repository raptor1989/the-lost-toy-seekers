<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 192 192" width="192" height="192">
  <!--
    Przycisk „dalej / graj" (ekran nagrody, menu) — zero tekstu, sam symbol (GDD sekcja 3).
    Gra pokazuje go w 96 px. Rodzina ui_play / ui_pause / ui_home ma ten sam talerz:
    kremowy krążek na złotym brzegu, kontur, miękki cień pod spodem, blik u góry-lewo.
    Trójkąt jest zielony (trawa z palety) — „idź", a nie ciemny, żeby wyglądał jak zaproszenie,
    nie jak ikona z pilota. Rogi trójkąta zaokrąglone w ścieżce, nie samym konturem.
    Paleta i grubości konturu: docs/Styleguide_Wektorowy.md
  -->
  <defs>
    <linearGradient id="ui_play_gold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#F2C94C"/>
      <stop offset="0.55" stop-color="#D9A440"/>
      <stop offset="1" stop-color="#D9A440"/>
    </linearGradient>
    <radialGradient id="ui_play_plate" cx="0.4" cy="0.32" r="0.8">
      <stop offset="0" stop-color="#F7F0E3"/>
      <stop offset="0.65" stop-color="#F7F0E3"/>
      <stop offset="1" stop-color="#EFD6B2"/>
    </radialGradient>
    <linearGradient id="ui_play_tri" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#8CD14A"/>
      <stop offset="1" stop-color="#4E9A52"/>
    </linearGradient>
    <filter id="ui_play_blur" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3"/>
    </filter>
    <filter id="ui_play_grain" x="0" y="0" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency="0.85" numOctaves="3" stitchTiles="stitch"/>
      <feColorMatrix type="saturate" values="0"/>
    </filter>
    <clipPath id="ui_play_disc"><circle cx="96" cy="92" r="80"/></clipPath>
  </defs>

  <!-- cień pod talerzem -->
  <circle cx="96" cy="99" r="80" fill="#14284F" opacity="0.5" filter="url(#ui_play_blur)"/>

  <g stroke="#4A3226" stroke-width="6" stroke-linejoin="round" stroke-linecap="round">
    <!-- złoty brzeg talerza -->
    <circle cx="96" cy="92" r="80" fill="url(#ui_play_gold)"/>
    <path d="M169,105 A74,74 0 0 1 109,165" fill="none" stroke="#4A3226" stroke-width="7" stroke-opacity="0.2"/>
    <path d="M23,79 A74,74 0 0 1 83,19" fill="none" stroke="#F2C94C" stroke-width="5" stroke-opacity="0.9"/>
    <!-- kremowy środek -->
    <circle cx="96" cy="92" r="68" fill="url(#ui_play_plate)" stroke-width="4"/>
    <ellipse cx="62" cy="52" rx="15" ry="8" fill="#FFFFFF" stroke="none" opacity="0.55" transform="rotate(-40 62 52)"/>

    <!-- trójkąt „graj" — rogi zaokrąglone w ścieżce -->
    <path d="M70,60 Q70,50 78.8,54.7 L139.2,87.3 Q148,92 139.2,96.7 L78.8,129.3 Q70,134 70,124 Z" fill="url(#ui_play_tri)"/>
    <path d="M77,64 L77,86" fill="none" stroke="#FFFFFF" stroke-width="5" stroke-opacity="0.45"/>
  </g>

  <!-- ziarno papieru — tylko na talerzu -->
  <rect width="192" height="192" filter="url(#ui_play_grain)" clip-path="url(#ui_play_disc)" opacity="0.12" style="mix-blend-mode:multiply"/>
</svg>
