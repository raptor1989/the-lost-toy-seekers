<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <!--
    Miękki żołądź z poziomu 4 — zrzucany dla żartu przez duszki, 32 px w grze.
    Bez buźki (to pocisk-zabawka, nie postać): duży orzech w kolorach kartonu
    (#DCA96D / #C89257), czapeczka w kratkę (#A8743F, kratka #6B4A2A), krótki ogonek,
    biały blik u góry orzecha, żeby czytał się jako gładka, lśniąca kulka. Sylwetka
    wypełnia prawie cały plik — przy 32 px liczy się masa, nie detal. Kontur #4A3226 3,
    gradient radialny na orzechu, ziarno papieru przycięte do sylwetki (ids acorn_*).
  -->
  <defs>
    <radialGradient id="acorn_nut" cx="0.38" cy="0.3" r="0.75">
      <stop offset="0" stop-color="#DCA96D"/>
      <stop offset="0.6" stop-color="#C89257"/>
      <stop offset="1" stop-color="#A8743F"/>
    </radialGradient>
    <filter id="acorn_grain" x="0" y="0" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency="0.85" numOctaves="3" stitchTiles="stitch"/>
      <feColorMatrix type="saturate" values="0"/>
    </filter>
    <clipPath id="acorn_cap">
      <path d="M9,26 C9,11 55,11 55,26 L53,30 C40,35 24,35 11,30 Z"/>
    </clipPath>
    <clipPath id="acorn_body">
      <path d="M32,24 C45,24 52,34 52,42 C52,53 43,61 32,61 C21,61 12,53 12,42 C12,34 19,24 32,24 Z"/>
      <path d="M9,26 C9,11 55,11 55,26 L53,30 C40,35 24,35 11,30 Z"/>
    </clipPath>
  </defs>

  <g stroke="#4A3226" stroke-width="3" stroke-linejoin="round" stroke-linecap="round">
    <!-- ogonek -->
    <path d="M32,14 L36,4" stroke="#6B4A2A" stroke-width="4.5"/>
    <path d="M32,14 L36,4" stroke="#4A3226" stroke-width="1.2" stroke-opacity="0.5"/>
    <!-- orzech -->
    <path d="M32,24 C45,24 52,34 52,42 C52,53 43,61 32,61 C21,61 12,53 12,42 C12,34 19,24 32,24 Z" fill="url(#acorn_nut)"/>
    <path d="M44,34 C46,40 45,50 40,56" fill="none" stroke="#A8743F" stroke-width="3" stroke-opacity="0.6"/>
    <!-- czapeczka w kratkę -->
    <path d="M9,26 C9,11 55,11 55,26 L53,30 C40,35 24,35 11,30 Z" fill="#A8743F"/>
    <g clip-path="url(#acorn_cap)" fill="none" stroke="#6B4A2A" stroke-width="1.8" stroke-opacity="0.85">
      <path d="M6,18 L30,36 M14,13 L38,34 M24,10 L46,32 M36,10 L56,28 M46,12 L62,26"/>
      <path d="M58,18 L34,36 M50,13 L26,34 M40,10 L18,32 M28,10 L8,28 M18,12 L2,26"/>
    </g>
    <path d="M14,28 C26,32 38,32 50,28" fill="none" stroke="#6B4A2A" stroke-width="2.2"/>
  </g>

  <!-- bliki -->
  <ellipse cx="23" cy="34" rx="5" ry="3" fill="#FFFFFF" opacity="0.6" transform="rotate(-35 23 34)"/>
  <circle cx="21" cy="42" r="1.8" fill="#FFFFFF" opacity="0.5"/>
  <ellipse cx="22" cy="17" rx="3.5" ry="1.6" fill="#FFFFFF" opacity="0.35" transform="rotate(-10 22 17)"/>

  <!-- ziarno papieru -->
  <rect width="64" height="64" filter="url(#acorn_grain)" clip-path="url(#acorn_body)" opacity="0.13" style="mix-blend-mode:multiply"/>
</svg>
