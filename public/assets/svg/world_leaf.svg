<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 192 56" width="192" height="56">
  <!--
    Pływający liść lilii wodnej — ruchoma platforma z poziomu 2 „Rzeka Bąbelków"
    (Dokumentacja 3.5, `MovingPlatform` wariant `leaf`). 96×28 px w grze,
    zaczepiony u góry (origin 0.5/0): górna krawędź pliku to poziom stóp, więc
    wierzch liścia leży tuż przy niej. Widok z lekkiej góry: elipsa wierzchu
    z gradientem, pod nią ciemniejszy rąbek grubości, nacięcie liścia od przodu
    (prześwituje woda), kwiat lilii na lewym końcu — tam elipsa jest niżej,
    więc kwiat mieści się nad liściem bez wychodzenia poza plik. Pod spodem
    cienki pas wody, który płynie razem z liściem.
  -->
  <defs>
    <radialGradient id="leaf_top" cx="0.42" cy="0.2" r="0.75">
      <stop offset="0" stop-color="#8CD14A"/>
      <stop offset="0.55" stop-color="#4E9A52"/>
      <stop offset="1" stop-color="#2F6B35"/>
    </radialGradient>
    <filter id="leaf_grain" x="0" y="0" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency="0.85" numOctaves="3" stitchTiles="stitch"/>
      <feColorMatrix type="saturate" values="0"/>
    </filter>
    <clipPath id="leaf_pad">
      <ellipse cx="96" cy="25" rx="90" ry="17"/>
      <ellipse cx="96" cy="20" rx="90" ry="17"/>
    </clipPath>
  </defs>

  <!-- pas wody pod liściem -->
  <ellipse cx="96" cy="41" rx="94" ry="12" fill="#5FB0E6" stroke="#2E7DBE" stroke-width="2"/>
  <path d="M24,47 C50,53 80,52 100,49 M120,49 C140,52 160,51 174,46" fill="none" stroke="#DCE8F7" stroke-width="2.2" stroke-opacity="0.7" stroke-linecap="round"/>

  <g stroke="#4A3226" stroke-width="3.5" stroke-linejoin="round" stroke-linecap="round">
    <!-- rąbek grubości liścia -->
    <ellipse cx="96" cy="25" rx="90" ry="17" fill="#2F6B35"/>
    <!-- wierzch -->
    <ellipse cx="96" cy="20" rx="90" ry="17" fill="url(#leaf_top)"/>
    <!-- nerwy -->
    <g fill="none" stroke="#2F6B35" stroke-width="2" stroke-opacity="0.6">
      <path d="M100,20 C80,16 60,12 36,15"/>
      <path d="M100,20 C85,24 70,30 52,31"/>
      <path d="M100,20 C120,13 140,10 160,13"/>
      <path d="M100,20 C125,25 150,28 168,25"/>
    </g>
    <!-- nacięcie liścia — prześwituje woda -->
    <path d="M100,19 L117,41.7 L137,40.4 Z" fill="#5FB0E6" stroke-width="3"/>
  </g>

  <!-- bliki kropel wody -->
  <ellipse cx="72" cy="11" rx="6" ry="3" fill="#FFFFFF" opacity="0.55" transform="rotate(-8 72 11)"/>
  <ellipse cx="136" cy="12" rx="4" ry="2.2" fill="#FFFFFF" opacity="0.5"/>

  <!-- ziarno papieru na liściu -->
  <rect width="192" height="56" filter="url(#leaf_grain)" clip-path="url(#leaf_pad)" opacity="0.13" style="mix-blend-mode:multiply"/>

  <!-- kwiat lilii -->
  <g stroke="#4A3226" stroke-width="2.4" stroke-linejoin="round" stroke-linecap="round">
    <path d="M30,11 L25,2.5 L31.5,8 L34,1.5 L35.5,8.5 L40,3 L37.5,10.5 L43,13.5 L37,14 L39,20 L33,16.5 L27,19.5 L28.5,14 L21.5,12 L28,10 Z" fill="#F9A8D4"/>
    <path d="M30,11 L34,13 L37.5,10.5 L37,14 L39,20 L33,16.5 L27,19.5 L28.5,14 Z" fill="#F06AB0" stroke="none"/>
    <circle cx="32.5" cy="12" r="3" fill="#FFD166" stroke-width="2"/>
  </g>
</svg>
