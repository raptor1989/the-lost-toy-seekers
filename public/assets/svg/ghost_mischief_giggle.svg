<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 96 96" width="96" height="96">
  <!--
    Duszek-Psotnik, klatka chichotu (kontakt z graczem, zanim zniknie w brokacie).
    Ta sama sylwetka i kolejność warstw, co w ghost_mischief_idle.svg; zmienia się
    twarz (oczy zamknięte ze śmiechu, buzia szeroko otwarta) i rączki — uniesione,
    jakby się klepał po brzuchu. Lekki przechył całości w prawo.
  -->
  <defs>
    <radialGradient id="ghostG_body" cx="0.42" cy="0.3" r="0.8">
      <stop offset="0" stop-color="#F3EEFF"/>
      <stop offset="0.5" stop-color="#D6CBF2"/>
      <stop offset="1" stop-color="#B9A9E0"/>
    </radialGradient>
    <radialGradient id="ghostG_glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#D6CBF2" stop-opacity="0.4"/>
      <stop offset="1" stop-color="#D6CBF2" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="ghostG_shade" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#4A3226" stop-opacity="0.16"/>
      <stop offset="0.5" stop-color="#4A3226" stop-opacity="0"/>
    </linearGradient>
    <filter id="ghostG_grain" x="0" y="0" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency="0.85" numOctaves="3" stitchTiles="stitch"/>
      <feColorMatrix type="saturate" values="0"/>
    </filter>
    <clipPath id="ghostG_clip">
      <g transform="rotate(6 48 60)">
        <path d="M16,50 C16,26 30,12 48,12 C66,12 80,26 80,50 L80,76
                 q-8,12 -16,0 q-8,-12 -16,0 q-8,12 -16,0 q-8,-12 -16,0 Z"/>
        <ellipse cx="19" cy="38" rx="8" ry="6.5"/>
        <ellipse cx="77" cy="38" rx="8" ry="6.5"/>
        <path d="M44,14 C40,8 44,2 52,4 C58,5 56,12 50,13 Z"/>
      </g>
    </clipPath>
  </defs>

  <circle cx="48" cy="48" r="47" fill="url(#ghostG_glow)"/>

  <g stroke="#4A3226" stroke-width="3" stroke-linejoin="round" stroke-linecap="round" transform="rotate(6 48 60)">

    <!-- rączki uniesione (za korpusem) -->
    <ellipse cx="19" cy="38" rx="8" ry="6.5" fill="#B9A9E0"/>
    <ellipse cx="77" cy="38" rx="8" ry="6.5" fill="#B9A9E0"/>

    <path d="M44,14 C40,8 44,2 52,4 C58,5 56,12 50,13 Z" fill="#D6CBF2"/>

    <path d="M16,50 C16,26 30,12 48,12 C66,12 80,26 80,50 L80,76
             q-8,12 -16,0 q-8,-12 -16,0 q-8,12 -16,0 q-8,-12 -16,0 Z" fill="url(#ghostG_body)"/>
    <path d="M16,70 L80,70 L80,76 q-8,12 -16,0 q-8,-12 -16,0 q-8,12 -16,0 q-8,-12 -16,0 Z"
          fill="#B9A9E0" stroke="none"/>

    <g clip-path="url(#ghostG_clip)">
      <ellipse cx="27" cy="55" rx="8" ry="5" fill="#F2908E" stroke="none" opacity="0.85"/>
      <ellipse cx="69" cy="55" rx="8" ry="5" fill="#F2908E" stroke="none" opacity="0.85"/>
    </g>

    <!-- oczy zamknięte ze śmiechu: łuki -->
    <path d="M30,43 C33,36 43,36 46,43" fill="none" stroke="#3A2820" stroke-width="3.4"/>
    <path d="M50,43 C53,36 63,36 66,43" fill="none" stroke="#3A2820" stroke-width="3.4"/>
    <path d="M30,30 C33,27 39,27 42,29" fill="none" stroke-width="2.4" stroke-opacity="0.8"/>
    <path d="M54,29 C57,27 63,27 66,30" fill="none" stroke-width="2.4" stroke-opacity="0.8"/>

    <!-- buzia szeroko otwarta -->
    <path d="M34,52 C38,68 58,68 62,52 Z" fill="#3A2820" stroke-width="2.6"/>
    <path d="M42,60 C45,57 51,57 54,60 C52,64 44,64 42,60 Z" fill="#E15240" stroke="none"/>
    <path d="M36,53 L60,53" fill="none" stroke="#F7F0E3" stroke-width="2.4" stroke-opacity="0.9"/>
  </g>

  <!-- nutki chichotu — bez konturu, lekkie -->
  <path d="M84,20 l0,-10 l6,-2 l0,10" fill="none" stroke="#FFD166" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
  <circle cx="82" cy="21" r="2.6" fill="#FFD166"/><circle cx="88" cy="19" r="2.6" fill="#FFD166"/>
  <path d="M10,26 l0,-8" fill="none" stroke="#FFD166" stroke-width="2.2" stroke-linecap="round"/>
  <circle cx="8" cy="27" r="2.4" fill="#FFD166"/>

  <rect width="96" height="96" fill="url(#ghostG_shade)" clip-path="url(#ghostG_clip)"/>
  <rect width="96" height="96" filter="url(#ghostG_grain)" clip-path="url(#ghostG_clip)"
        opacity="0.1" style="mix-blend-mode:multiply"/>
</svg>
