<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <!--
    Gracz 1 — Miś-dzieciak, poza spoczynkowa.
    Skręt 3/4 w prawo realizowany JEDNYM przesunięciem: wszystkie rysy twarzy
    (oczy, pyszczek, policzki) mają wspólny środek x=67 zamiast 64. Oczy na tej
    samej wysokości — asymetria wysokości czytała się jako krzywizna, nie jako obrót.
    Kolejność warstw od tyłu: plecak → nogi → dalsza ręka → tułów → koszulka
    → szelki → rękawy → bliższa ręka → uszy → głowa → twarz.
    Paleta i grubości konturu: patrz docs/Styleguide_Wektorowy.md
  -->
  <defs>
    <!-- miękki cień od lewej — daje bryłę bez twardej krawędzi -->
    <linearGradient id="shade" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0"   stop-color="#4A3226" stop-opacity="0.24"/>
      <stop offset="0.5" stop-color="#4A3226" stop-opacity="0"/>
    </linearGradient>
    <!-- ziarno papieru — namiastka faktury kredki -->
    <filter id="grain" x="0" y="0" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency="0.85" numOctaves="3" stitchTiles="stitch"/>
      <feColorMatrix type="saturate" values="0"/>
    </filter>
    <!-- rumieńce muszą kończyć się na obrysie głowy, nie wystawać poza sylwetkę -->
    <clipPath id="cHead">
      <ellipse cx="64" cy="40" rx="31" ry="28"/>
    </clipPath>
    <!-- obszar, na który nakładamy cień i ziarno -->
    <clipPath id="cChar">
      <ellipse cx="64" cy="40" rx="31" ry="28"/>
      <circle cx="42" cy="15" r="11.5"/>
      <circle cx="86" cy="14" r="12.5"/>
      <path d="M46,66 C41,76 39,88 42,96 C46,103 82,103 86,96 C89,88 87,76 82,66 Z"/>
      <path d="M49,90 C47,101 46,112 49,116 C53,120 61,120 64,116 C66,112 63,101 62,90 Z"/>
      <path d="M69,90 C67,101 66,113 69,117 C73,121 81,121 84,117 C87,113 83,101 82,90 Z"/>
    </clipPath>
  </defs>

  <g stroke="#4A3226" stroke-width="3" stroke-linejoin="round" stroke-linecap="round">

    <!-- ===== plecak (najgłębsza warstwa) ===== -->
    <rect x="20" y="58" width="28" height="40" rx="12" fill="#E15240"/>
    <path d="M20 72 C20 63 26 58 34 58 C42 58 48 63 48 72 Z" fill="#C23F2F"/>
    <rect x="24" y="77" width="18" height="15" rx="6" fill="#F2705C"/>
    <rect x="30" y="70" width="7" height="6" rx="2" fill="#8E2A1E" stroke-width="2"/>

    <!-- ===== nogi (za tułowiem, widoczna szpara między nimi) ===== -->
    <path d="M49,90 C47,101 46,112 49,116 C53,120 61,120 64,116 C66,112 63,101 62,90 Z" fill="#A96F36"/>
    <path d="M69,90 C67,101 66,113 69,117 C73,121 81,121 84,117 C87,113 83,101 82,90 Z" fill="#C8894B"/>
    <ellipse cx="56" cy="114" rx="6" ry="3.2" fill="#E0A882" stroke-width="2"/>
    <ellipse cx="76" cy="115" rx="6.5" ry="3.4" fill="#E0A882" stroke-width="2"/>

    <!-- ===== dalsza ręka (za tułowiem) ===== -->
    <path d="M41,82 C36,89 35,97 38,101 C42,105 48,103 48,98 C48,92 47,86 46,82 Z" fill="#A96F36"/>

    <!-- ===== tułów ===== -->
    <path d="M46,66 C41,76 39,88 42,96 C46,103 82,103 86,96 C89,88 87,76 82,66 Z" fill="#C8894B"/>

    <!-- ===== koszulka ===== -->
    <path d="M46,72 C43,81 42,90 45,96 C50,101 78,101 83,96 C86,90 85,81 82,72 Z" fill="#F7F0E3"/>
    <path d="M57,72 C61,78 67,78 71,72" fill="none" stroke-width="2.2"/>

    <!-- ===== szelki plecaka (na koszulce) ===== -->
    <path d="M50,68 C47,76 47,86 48,96 L54,96 C55,86 55,76 57,68 Z" fill="#C23F2F"/>
    <path d="M73,68 C78,76 78,86 77,96 L83,96 C84,86 84,76 79,68 Z" fill="#E15240"/>

    <!-- ===== rękawy (przykrywają nasady rąk = to koszulka, nie fartuch) ===== -->
    <path d="M47,72 C39,74 35,80 37,86 C40,90 46,89 48,84 Z" fill="#F7F0E3"/>
    <path d="M81,72 C89,74 93,80 91,86 C88,90 82,89 80,84 Z" fill="#F7F0E3"/>

    <!-- ===== bliższa ręka (przed tułowiem) ===== -->
    <path d="M87,84 C92,90 93,98 90,102 C86,106 80,104 80,99 C80,93 81,88 82,84 Z" fill="#C8894B"/>

    <!-- ===== uszy (za głową) ===== -->
    <circle cx="42" cy="15" r="11.5" fill="#B87B3F"/>
    <circle cx="86" cy="14" r="12.5" fill="#C8894B"/>

    <!-- kosmyk na czubku głowy -->
    <path d="M57,14 C59,5 65,4 66,11 C68,3 75,4 75,13 Z" fill="#C8894B"/>

    <!-- ===== głowa ===== -->
    <ellipse cx="64" cy="40" rx="31" ry="28" fill="#C8894B"/>

    <!-- wnętrza uszu (na głowie, żeby nie zlewały się z konturem) -->
    <circle cx="42" cy="15" r="5.5" fill="#E0A882" stroke-width="2.2"/>
    <circle cx="87" cy="14" r="6"   fill="#E0A882" stroke-width="2.2"/>

    <!-- ===== twarz — wspólny środek x=67 ===== -->
    <g clip-path="url(#cHead)">
      <ellipse cx="44" cy="46" rx="7.5" ry="5" fill="#F2908E" stroke="none" opacity="0.85"/>
      <ellipse cx="90" cy="45" rx="7.5" ry="5" fill="#F2908E" stroke="none" opacity="0.85"/>
    </g>

    <ellipse cx="68" cy="50" rx="17" ry="12.5" fill="#EFD6B2"/>

    <path d="M61,42.5 C65,39.5 71,39.5 75,42.5 C75,48 71,51 68,51 C65,51 61,48 61,42.5 Z"
          fill="#4A3226" stroke="none"/>
    <path d="M68,51 C68,55 63,57.5 60,54" fill="none" stroke-width="2.4"/>
    <path d="M68,51 C68,55 73,57.5 76,54" fill="none" stroke-width="2.4"/>

    <circle cx="54" cy="35.5" r="5" fill="#3A2820" stroke="none"/>
    <circle cx="80" cy="35.5" r="5" fill="#3A2820" stroke="none"/>
    <circle cx="55.6" cy="33.6" r="1.9" fill="#FFFFFF" stroke="none"/>
    <circle cx="81.6" cy="33.6" r="1.9" fill="#FFFFFF" stroke="none"/>

    <path d="M48,26 C52,23 57,23 60,25.5" fill="none" stroke-width="2.4" stroke-opacity="0.75"/>
    <path d="M74,25.5 C77,23 82,23 86,26" fill="none" stroke-width="2.4" stroke-opacity="0.75"/>
  </g>

  <!-- ===== bryła i faktura (na wierzchu, przycięte do sylwetki) ===== -->
  <rect width="128" height="128" fill="url(#shade)" clip-path="url(#cChar)"/>
  <rect width="128" height="128" filter="url(#grain)" clip-path="url(#cChar)"
        opacity="0.14" style="mix-blend-mode:multiply"/>
</svg>
