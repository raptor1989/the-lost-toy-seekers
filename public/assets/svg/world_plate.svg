<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 20" width="128" height="20">
  <!--
    Płytka przycisku tamy (Dokumentacja 3.5). 64×10 px w grze, zaczepiona u dołu
    (origin 0.5/1) — gra spłaszcza ją tweenem `scaleY`, gdy ktoś na niej stoi,
    więc dolna krawędź musi leżeć dokładnie na dolnej krawędzi pliku.
    Cała biała #FFFFFF, bo `setTint` barwi ją kolorem uprawnionego gracza; grubość
    (boczna ścianka) to półprzezroczysta czerń, która po tincie da ciemniejszy ton
    tego samego koloru. Kontur ciemny brąz, rogi zaokrąglone — guzik, nie płyta.
  -->
  <defs>
    <clipPath id="plate_clip"><rect x="3" y="3" width="122" height="15.5" rx="6"/></clipPath>
  </defs>
  <g stroke="#4A3226" stroke-width="3" stroke-linejoin="round" stroke-linecap="round">
    <rect x="3" y="3" width="122" height="15.5" rx="6" fill="#FFFFFF"/>
    <!-- boczna ścianka (grubość guzika) -->
    <rect x="3" y="11" width="122" height="7.5" fill="#000000" fill-opacity="0.2" stroke="none" clip-path="url(#plate_clip)"/>
    <path d="M4.5,11 H123.5" fill="none" stroke-width="2" stroke-opacity="0.4"/>
  </g>
</svg>
