<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 192 192" width="192" height="192">
  <!--
    Przycisk „pauza" — dwa pionowe, pulchne paski na tym samym talerzu co ui_play.
    Gra pokazuje go w 96 px. Paski niebieskie (cukierek niebieski z palety): spokojny
    kolor, nie czerwony „stop", żeby pauza nie wyglądała jak kara.
    Talerz: kremowy krążek na złotym brzegu, kontur, cień pod spodem, blik, ziarno.
    Paleta i grubości konturu: docs/Styleguide_Wektorowy.md
  -->
  <defs>
    <linearGradient id="ui_pause_gold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#F2C94C"/>
      <stop offset="0.55" stop-color="#D9A440"/>
      <stop offset="1" stop-color="#D9A440"/>
    </linearGradient>
    <radialGradient id="ui_pause_plate" cx="0.4" cy="0.32" r="0.8">
      <stop offset="0" stop-color="#F7F0E3"/>
      <stop offset="0.65" stop-color="#F7F0E3"/>
      <stop offset="1" stop-color="#EFD6B2"/>
    </radialGradient>
    <linearGradient id="ui_pause_bar" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#9CCBF2"/>
      <stop offset="0.45" stop-color="#4A90D9"/>
      <stop offset="1" stop-color="#4A90D9"/>
    </linearGradient>
    <filter id="ui_pause_blur" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3"/>
    </filter>
    <filter id="ui_pause_grain" x="0" y="0" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency="0.85" numOctaves="3" stitchTiles="stitch"/>
      <feColorMatrix type="saturate" values="0"/>
    </filter>
    <clipPath id="ui_pause_disc"><circle cx="96" cy="92" r="80"/></clipPath>
  </defs>

  <!-- cień pod talerzem -->
  <circle cx="96" cy="99" r="80" fill="#14284F" opacity="0.5" filter="url(#ui_pause_blur)"/>

  <g stroke="#4A3226" stroke-width="6" stroke-linejoin="round" stroke-linecap="round">
    <!-- złoty brzeg talerza -->
    <circle cx="96" cy="92" r="80" fill="url(#ui_pause_gold)"/>
    <path d="M169,105 A74,74 0 0 1 109,165" fill="none" stroke="#4A3226" stroke-width="7" stroke-opacity="0.2"/>
    <path d="M23,79 A74,74 0 0 1 83,19" fill="none" stroke="#F2C94C" stroke-width="5" stroke-opacity="0.9"/>
    <!-- kremowy środek -->
    <circle cx="96" cy="92" r="68" fill="url(#ui_pause_plate)" stroke-width="4"/>
    <ellipse cx="62" cy="52" rx="15" ry="8" fill="#FFFFFF" stroke="none" opacity="0.55" transform="rotate(-40 62 52)"/>

    <!-- dwa paski pauzy -->
    <rect x="60" y="50" width="28" height="84" rx="13" fill="url(#ui_pause_bar)"/>
    <rect x="104" y="50" width="28" height="84" rx="13" fill="url(#ui_pause_bar)"/>
    <path d="M69,61 L69,83 M113,61 L113,83" fill="none" stroke="#FFFFFF" stroke-width="5" stroke-opacity="0.5"/>
  </g>

  <!-- ziarno papieru — tylko na talerzu -->
  <rect width="192" height="192" filter="url(#ui_pause_grain)" clip-path="url(#ui_pause_disc)" opacity="0.12" style="mix-blend-mode:multiply"/>
</svg>
