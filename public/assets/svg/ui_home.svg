<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 192 192" width="192" height="192">
  <!--
    Przycisk „do domu" (powrót do menu) — domek na tym samym talerzu co ui_play.
    Gra pokazuje go w 96 px. Czerwony daszek (czerwień plecaka z palety), kremowe ścianki,
    drzwi w kolorze futra i okrągłe okienko na poddaszu, które świeci brokatem (#FFD166)
    z jaśniejszym rdzeniem — „w domu ktoś czeka". Komin dla sylwetki.
    Paleta i grubości konturu: docs/Styleguide_Wektorowy.md
  -->
  <defs>
    <linearGradient id="ui_home_gold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#F2C94C"/>
      <stop offset="0.55" stop-color="#D9A440"/>
      <stop offset="1" stop-color="#D9A440"/>
    </linearGradient>
    <radialGradient id="ui_home_plate" cx="0.4" cy="0.32" r="0.8">
      <stop offset="0" stop-color="#F7F0E3"/>
      <stop offset="0.65" stop-color="#F7F0E3"/>
      <stop offset="1" stop-color="#EFD6B2"/>
    </radialGradient>
    <linearGradient id="ui_home_roof" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#F2705C"/>
      <stop offset="0.45" stop-color="#E15240"/>
      <stop offset="1" stop-color="#C23F2F"/>
    </linearGradient>
    <radialGradient id="ui_home_window" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#FFF2B2"/>
      <stop offset="0.6" stop-color="#FFD166"/>
      <stop offset="1" stop-color="#FFD166"/>
    </radialGradient>
    <radialGradient id="ui_home_glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#FFD166" stop-opacity="0.85"/>
      <stop offset="0.5" stop-color="#FFD166" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#FFD166" stop-opacity="0"/>
    </radialGradient>
    <filter id="ui_home_blur" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3"/>
    </filter>
    <filter id="ui_home_grain" x="0" y="0" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency="0.85" numOctaves="3" stitchTiles="stitch"/>
      <feColorMatrix type="saturate" values="0"/>
    </filter>
    <clipPath id="ui_home_disc"><circle cx="96" cy="92" r="80"/></clipPath>
  </defs>

  <!-- cień pod talerzem -->
  <circle cx="96" cy="99" r="80" fill="#14284F" opacity="0.5" filter="url(#ui_home_blur)"/>

  <g stroke="#4A3226" stroke-width="6" stroke-linejoin="round" stroke-linecap="round">
    <!-- złoty brzeg talerza -->
    <circle cx="96" cy="92" r="80" fill="url(#ui_home_gold)"/>
    <path d="M169,105 A74,74 0 0 1 109,165" fill="none" stroke="#4A3226" stroke-width="7" stroke-opacity="0.2"/>
    <path d="M23,79 A74,74 0 0 1 83,19" fill="none" stroke="#F2C94C" stroke-width="5" stroke-opacity="0.9"/>
    <!-- kremowy środek -->
    <circle cx="96" cy="92" r="68" fill="url(#ui_home_plate)" stroke-width="4"/>
    <ellipse cx="62" cy="52" rx="15" ry="8" fill="#FFFFFF" stroke="none" opacity="0.55" transform="rotate(-40 62 52)"/>

    <!-- domek: komin → ścianki ze szczytem → drzwi → okienko → daszek -->
    <rect x="120" y="56" width="16" height="32" rx="3" fill="#C8894B" stroke-width="4"/>
    <path d="M54,106 L96,60 L138,106 L138,144 Q138,150 132,150 L60,150 Q54,150 54,144 Z" fill="#EFD6B2"/>
    <path d="M85,150 L85,128 A11,11 0 0 1 107,128 L107,150 Z" fill="#C8894B" stroke-width="4"/>
    <path d="M90,150 L90,130" fill="none" stroke="#A96F36" stroke-width="3" stroke-opacity="0.7"/>
    <circle cx="96" cy="88" r="22" fill="url(#ui_home_glow)" stroke="none"/>
    <circle cx="96" cy="88" r="11" fill="url(#ui_home_window)" stroke-width="4"/>
    <path d="M36,108 L96,40 L156,108 L140,108 L96,60 L52,108 Z" fill="url(#ui_home_roof)"/>
    <path d="M58,100 L90,62" fill="none" stroke="#FFFFFF" stroke-width="4" stroke-opacity="0.35"/>
  </g>

  <!-- ziarno papieru — tylko na talerzu -->
  <rect width="192" height="192" filter="url(#ui_home_grain)" clip-path="url(#ui_home_disc)" opacity="0.12" style="mix-blend-mode:multiply"/>
</svg>
