<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256">
  <!--
    Nagroda poziomu 3 — „Klockowy Robot" (GDD sekcja 4).
    Jeden plik obsługuje trzy miejsca: ekran nagrody (360 px), metę poziomu (96 px)
    i HUD/menu (68–108 px, nieodzyskana = ciemna sylwetka przez tint). Sylwetka to
    klasyczna „ikona robota": kwadratowa głowa z antenką, szeroki korpus, nogi
    i jedna łapa uniesiona w geście „cześć!" — asymetria ożywia ciemny kształt.
    Robot zbudowany jest z dużych klocków (żółta głowa, niebieski korpus, czerwone
    ręce i stopy, zielone nogi), każdy z wypustkami na górze. Złote śruby łączą
    ręce z korpusem. Zero kłów, zero kantów — wszystko zaokrąglone (rx), buzia jak u misia.
    Kolejność warstw od tyłu: antenka → wypustki głowy → nogi → stopy → wypustki
    korpusu → korpus → ręce → dłonie → śruby → głowa → twarz.
    Paleta i grubości konturu: patrz docs/Styleguide_Wektorowy.md
  -->
  <defs>
    <!-- miękki cień od lewej — jak u misia -->
    <linearGradient id="robot_shade" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0"   stop-color="#4A3226" stop-opacity="0.24"/>
      <stop offset="0.5" stop-color="#4A3226" stop-opacity="0"/>
    </linearGradient>
    <!-- ziarno papieru -->
    <filter id="robot_grain" x="0" y="0" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency="0.85" numOctaves="3" stitchTiles="stitch"/>
      <feColorMatrix type="saturate" values="0"/>
    </filter>
    <!-- rumieńce kończą się na obrysie głowy -->
    <clipPath id="robot_head">
      <rect x="84" y="44" width="88" height="70" rx="10"/>
    </clipPath>
    <!-- sylwetka: te same kształty co niżej, inaczej cień urwie się w połowie -->
    <clipPath id="robot_toy">
      <circle cx="128" cy="22" r="10"/>
      <rect x="125" y="31" width="6" height="11"/>
      <rect x="92" y="34" width="20" height="12" rx="3"/>
      <rect x="144" y="34" width="20" height="12" rx="3"/>
      <rect x="84" y="44" width="88" height="70" rx="10"/>
      <rect x="76" y="114" width="20" height="12" rx="3"/>
      <rect x="104" y="114" width="20" height="12" rx="3"/>
      <rect x="132" y="114" width="20" height="12" rx="3"/>
      <rect x="160" y="114" width="20" height="12" rx="3"/>
      <rect x="68" y="124" width="120" height="74" rx="10"/>
      <rect x="36" y="124" width="20" height="12" rx="3"/>
      <rect x="28" y="134" width="36" height="62" rx="10"/>
      <circle cx="46" cy="206" r="16"/>
      <rect x="192" y="72" width="36" height="62" rx="10"/>
      <circle cx="210" cy="66" r="16"/>
      <circle cx="62" cy="134" r="9"/>
      <circle cx="194" cy="134" r="9"/>
      <rect x="84" y="198" width="36" height="28" rx="6"/>
      <rect x="136" y="198" width="36" height="28" rx="6"/>
      <rect x="74" y="222" width="52" height="22" rx="8"/>
      <rect x="130" y="222" width="52" height="22" rx="8"/>
    </clipPath>
  </defs>

  <g stroke="#4A3226" stroke-width="3" stroke-linejoin="round" stroke-linecap="round">

    <!-- ===== antenka z kulką ===== -->
    <rect x="125" y="31" width="6" height="11" fill="#D9A440" stroke-width="2"/>
    <circle cx="128" cy="22" r="10" fill="#E15240"/>
    <circle cx="124.5" cy="18.5" r="3.5" fill="#FFFFFF" stroke="none" opacity="0.7"/>

    <!-- ===== wypustki na głowie ===== -->
    <rect x="92" y="34" width="20" height="12" rx="3" fill="#FFD166"/>
    <rect x="144" y="34" width="20" height="12" rx="3" fill="#FFD166"/>
    <rect x="95" y="36" width="14" height="3" rx="1.5" fill="#FFFFFF" stroke="none" opacity="0.55"/>
    <rect x="147" y="36" width="14" height="3" rx="1.5" fill="#FFFFFF" stroke="none" opacity="0.55"/>

    <!-- ===== nogi i stopy ===== -->
    <rect x="84" y="198" width="36" height="28" rx="6" fill="#4E9A52"/>
    <rect x="136" y="198" width="36" height="28" rx="6" fill="#4E9A52"/>
    <rect x="89" y="203" width="12" height="4" rx="2" fill="#FFFFFF" stroke="none" opacity="0.4"/>
    <rect x="141" y="203" width="12" height="4" rx="2" fill="#FFFFFF" stroke="none" opacity="0.4"/>
    <rect x="74" y="222" width="52" height="22" rx="8" fill="#E15240"/>
    <rect x="130" y="222" width="52" height="22" rx="8" fill="#E15240"/>
    <rect x="80" y="227" width="20" height="4" rx="2" fill="#FFFFFF" stroke="none" opacity="0.45"/>
    <rect x="136" y="227" width="20" height="4" rx="2" fill="#FFFFFF" stroke="none" opacity="0.45"/>

    <!-- ===== wypustki korpusu (środkowe dwie = „szyja") ===== -->
    <rect x="76" y="114" width="20" height="12" rx="3" fill="#4A90D9"/>
    <rect x="104" y="114" width="20" height="12" rx="3" fill="#4A90D9"/>
    <rect x="132" y="114" width="20" height="12" rx="3" fill="#4A90D9"/>
    <rect x="160" y="114" width="20" height="12" rx="3" fill="#4A90D9"/>
    <g fill="#FFFFFF" stroke="none" opacity="0.5">
      <rect x="79" y="116" width="14" height="3" rx="1.5"/>
      <rect x="107" y="116" width="14" height="3" rx="1.5"/>
      <rect x="135" y="116" width="14" height="3" rx="1.5"/>
      <rect x="163" y="116" width="14" height="3" rx="1.5"/>
    </g>

    <!-- ===== korpus ===== -->
    <rect x="68" y="124" width="120" height="74" rx="10" fill="#4A90D9"/>
    <rect x="74" y="130" width="40" height="9" rx="4.5" fill="#FFFFFF" stroke="none" opacity="0.35"/>
    <!-- panel na brzuchu z dwoma guzikami -->
    <rect x="104" y="140" width="48" height="40" rx="8" fill="#FFD166" stroke-width="2.4"/>
    <circle cx="118" cy="160" r="6" fill="#E15240" stroke-width="2.2"/>
    <circle cx="138" cy="160" r="6" fill="#4E9A52" stroke-width="2.2"/>
    <circle cx="116" cy="158" r="1.8" fill="#FFFFFF" stroke="none" opacity="0.7"/>
    <circle cx="136" cy="158" r="1.8" fill="#FFFFFF" stroke="none" opacity="0.7"/>

    <!-- ===== lewa ręka (opuszczona) ===== -->
    <rect x="36" y="124" width="20" height="12" rx="3" fill="#E15240"/>
    <rect x="39" y="126" width="14" height="3" rx="1.5" fill="#FFFFFF" stroke="none" opacity="0.55"/>
    <rect x="28" y="134" width="36" height="62" rx="10" fill="#E15240"/>
    <rect x="33" y="140" width="9" height="24" rx="4.5" fill="#FFFFFF" stroke="none" opacity="0.35"/>
    <circle cx="46" cy="206" r="16" fill="#FFD166"/>
    <ellipse cx="41" cy="200" rx="5" ry="3.5" fill="#FFFFFF" stroke="none" opacity="0.5" transform="rotate(-35 41 200)"/>

    <!-- ===== prawa ręka (uniesiona — macha „cześć!") ===== -->
    <rect x="192" y="72" width="36" height="62" rx="10" fill="#E15240"/>
    <rect x="197" y="84" width="9" height="24" rx="4.5" fill="#FFFFFF" stroke="none" opacity="0.35"/>
    <circle cx="210" cy="66" r="16" fill="#FFD166"/>
    <ellipse cx="205" cy="60" rx="5" ry="3.5" fill="#FFFFFF" stroke="none" opacity="0.5" transform="rotate(-35 205 60)"/>

    <!-- ===== złote śruby w barkach ===== -->
    <circle cx="62" cy="134" r="9" fill="#D9A440" stroke-width="2.4"/>
    <circle cx="194" cy="134" r="9" fill="#D9A440" stroke-width="2.4"/>
    <circle cx="62" cy="134" r="3.5" fill="#F2C94C" stroke="none"/>
    <circle cx="194" cy="134" r="3.5" fill="#F2C94C" stroke="none"/>

    <!-- ===== głowa ===== -->
    <rect x="84" y="44" width="88" height="70" rx="10" fill="#FFD166"/>
    <rect x="90" y="50" width="34" height="9" rx="4.5" fill="#FFFFFF" stroke="none" opacity="0.4"/>

    <!-- ===== twarz — jak u misia: ciemne oczy z iskrą, rumieńce, otwarty uśmiech ===== -->
    <g clip-path="url(#robot_head)">
      <ellipse cx="97" cy="92" rx="8" ry="5" fill="#F2908E" stroke="none" opacity="0.85"/>
      <ellipse cx="159" cy="92" rx="8" ry="5" fill="#F2908E" stroke="none" opacity="0.85"/>
    </g>
    <circle cx="110" cy="76" r="9" fill="#3A2820" stroke="none"/>
    <circle cx="146" cy="76" r="9" fill="#3A2820" stroke="none"/>
    <circle cx="107" cy="73" r="3.2" fill="#FFFFFF" stroke="none"/>
    <circle cx="143" cy="73" r="3.2" fill="#FFFFFF" stroke="none"/>
    <circle cx="113" cy="79" r="1.5" fill="#FFFFFF" stroke="none" opacity="0.9"/>
    <circle cx="149" cy="79" r="1.5" fill="#FFFFFF" stroke="none" opacity="0.9"/>
    <path d="M110,92 C118,106 138,106 146,92 Z" fill="#3A2820" stroke-width="2.4"/>
  </g>

  <!-- ===== bryła i faktura (na wierzchu, przycięte do sylwetki) ===== -->
  <rect width="256" height="256" fill="url(#robot_shade)" clip-path="url(#robot_toy)"/>
  <rect width="256" height="256" filter="url(#robot_grain)" clip-path="url(#robot_toy)"
        opacity="0.14" style="mix-blend-mode:multiply"/>
</svg>
