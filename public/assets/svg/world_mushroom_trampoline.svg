<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <!--
    Grzyb-trampolina z poziomu 4 „Domek na Drzewie" — wielki, sprężysty muchomor,
    na którym się odbija. ~96 px w grze. Kapelusz jak u małego muchomora z L1
    (czerwień #E15240 + kremowe kropki), ale „napompowany": szeroki, pękaty, z wyraźnie
    płaskim, jasnym wierzchem (elipsa #F2705C) — to on mówi dziecku „tu skacz".
    Wierzch kapelusza leży w górnej ćwiartce pliku (y≈28), żeby sprite zaczepiony
    u góry trzymał stopy gracza na kapeluszu. Trzonek krótki i gruby (kremowy #F7F0E3,
    cień #EFD6B2), pod kapeluszem pas blaszek. Kreski „sprężyny" po bokach — symbol
    odbicia, bez tekstu. Kontur #4A3226, gradienty radialne na bryłach, ziarno papieru
    przycięte do sylwetki (ids z prefiksem mtramp_).
  -->
  <defs>
    <radialGradient id="mtramp_cap" cx="0.42" cy="0.3" r="0.75">
      <stop offset="0" stop-color="#F2705C"/>
      <stop offset="0.5" stop-color="#E15240"/>
      <stop offset="1" stop-color="#C23F2F"/>
    </radialGradient>
    <radialGradient id="mtramp_stem" cx="0.4" cy="0.3" r="0.8">
      <stop offset="0" stop-color="#F7F0E3"/>
      <stop offset="0.7" stop-color="#F7F0E3"/>
      <stop offset="1" stop-color="#EFD6B2"/>
    </radialGradient>
    <linearGradient id="mtramp_shade" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#4A3226" stop-opacity="0.22"/>
      <stop offset="0.5" stop-color="#4A3226" stop-opacity="0"/>
    </linearGradient>
    <filter id="mtramp_grain" x="0" y="0" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency="0.85" numOctaves="3" stitchTiles="stitch"/>
      <feColorMatrix type="saturate" values="0"/>
    </filter>
    <clipPath id="mtramp_body">
      <path d="M44,74 C42,88 40,100 36,114 L92,114 C88,100 86,88 84,74 Z"/>
      <path d="M8,62 C8,46 20,32 40,28 L88,28 C108,32 120,46 120,62 C120,74 100,80 64,80 C28,80 8,74 8,62 Z"/>
    </clipPath>
  </defs>

  <g stroke="#4A3226" stroke-width="3" stroke-linejoin="round" stroke-linecap="round">
    <!-- trzonek -->
    <path d="M44,74 C42,88 40,100 36,114 L92,114 C88,100 86,88 84,74 Z" fill="url(#mtramp_stem)"/>
    <path d="M78,78 C79,90 81,100 84,110" fill="none" stroke="#EFD6B2" stroke-width="5"/>
    <!-- podstawa -->
    <path d="M30,114 C30,108 98,108 98,114 C98,120 30,120 30,114 Z" fill="#EFD6B2"/>

    <!-- blaszki pod kapeluszem -->
    <path d="M14,66 C14,76 40,82 64,82 C88,82 114,76 114,66 Z" fill="#EFD6B2"/>
    <g fill="none" stroke="#E0A882" stroke-width="2">
      <path d="M26,72 L28,78 M40,76 L41,81 M54,78 L54,83 M74,78 L74,83 M88,76 L87,81 M102,72 L100,78"/>
    </g>

    <!-- kapelusz: pękaty, z płaskim wierzchem -->
    <path d="M8,62 C8,46 20,32 40,28 L88,28 C108,32 120,46 120,62 C120,74 100,80 64,80 C28,80 8,74 8,62 Z" fill="url(#mtramp_cap)"/>
    <!-- płaski, zapraszający wierzch -->
    <ellipse cx="64" cy="34" rx="40" ry="7.5" fill="#F2705C" stroke-width="2.6"/>
    <path d="M34,32 C44,28.5 84,28.5 94,32" fill="none" stroke="#FFFFFF" stroke-width="2.6" stroke-opacity="0.6"/>

    <!-- kropki -->
    <g fill="#F7F0E3" stroke="none">
      <circle cx="28" cy="50" r="6.5"/>
      <circle cx="64" cy="58" r="5.5"/>
      <circle cx="100" cy="52" r="6.5"/>
      <circle cx="46" cy="68" r="4"/>
      <circle cx="84" cy="70" r="4"/>
      <circle cx="46" cy="44" r="3"/>
      <circle cx="84" cy="44" r="3"/>
      <ellipse cx="64" cy="34" rx="5" ry="2.4"/>
    </g>
    <!-- blik na kapeluszu -->
    <path d="M18,56 C20,47 26,41 36,38" fill="none" stroke="#FFFFFF" stroke-width="3.5" stroke-opacity="0.55"/>

    <!-- kreski sprężyny — „tu się odbija" -->
    <g fill="none" stroke="#FFD166" stroke-width="3">
      <path d="M4,52 q-4,10 0,20 M124,52 q4,10 0,20"/>
      <path d="M12,30 q-6,4 -6,10 M116,30 q6,4 6,10" stroke-width="2.4" stroke-opacity="0.8"/>
    </g>
  </g>

  <!-- bryła: cień od lewej + ziarno papieru, przycięte do sylwetki -->
  <rect width="128" height="128" fill="url(#mtramp_shade)" clip-path="url(#mtramp_body)"/>
  <rect width="128" height="128" filter="url(#mtramp_grain)" clip-path="url(#mtramp_body)" opacity="0.13" style="mix-blend-mode:multiply"/>
</svg>
