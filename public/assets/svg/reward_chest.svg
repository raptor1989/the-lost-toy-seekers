<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256">
  <!--
    Nagroda poziomu 4 — „Wielka Skrzynia Skarbów" z resztą zabawek (GDD sekcja 4).
    Jeden plik obsługuje trzy miejsca: ekran nagrody (360 px), metę poziomu (96 px)
    i HUD/menu (68–108 px, nieodzyskana = ciemna sylwetka przez tint). Sylwetka to
    pękata skrzynia z uchylonym, łukowatym wiekiem i kopczykiem w otworze — „skarb"
    czyta się po samym kształcie, blask i gwiazdki są tylko dodatkiem.
    Z otworu bije poświata (#FFF2B2 → #FFD166), a ze środka wysypują się zabawki
    (piłka, klocek, cukierki) i złote monety; dwie monety leżą obok skrzyni.
    Blask i gwiazdki NIE wchodzą do clipPath sylwetki, żeby ziarno i cień ich nie brudziły.
    Kolejność warstw od tyłu: poświata-halo → wieko (krawędź, wnętrze, okucia)
    → poświata w otworze → zabawki → kopczyk monet → skrzynia → deski → okucia
    → zamek → monety obok → gwiazdki.
    Paleta i grubości konturu: patrz docs/Styleguide_Wektorowy.md
  -->
  <defs>
    <!-- szeroka poświata za skrzynią -->
    <!-- krycie trzymane nisko: w HUD nieodzyskana nagroda jest tintowana na czarno
         i zbyt mocne halo robiłoby ciemną mgiełkę wokół sylwetki -->
    <radialGradient id="chest_halo" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0"   stop-color="#FFF2B2" stop-opacity="0.8"/>
      <stop offset="0.4" stop-color="#FFD166" stop-opacity="0.3"/>
      <stop offset="1"   stop-color="#FFD166" stop-opacity="0"/>
    </radialGradient>
    <!-- rdzeń blasku w otworze skrzyni -->
    <radialGradient id="chest_glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0"   stop-color="#FFF2B2" stop-opacity="0.95"/>
      <stop offset="0.5" stop-color="#FFD166" stop-opacity="0.55"/>
      <stop offset="1"   stop-color="#FFD166" stop-opacity="0"/>
    </radialGradient>
    <!-- miękki cień od lewej — jak u misia -->
    <linearGradient id="chest_shade" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0"   stop-color="#4A3226" stop-opacity="0.24"/>
      <stop offset="0.5" stop-color="#4A3226" stop-opacity="0"/>
    </linearGradient>
    <!-- ziarno papieru -->
    <filter id="chest_grain" x="0" y="0" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency="0.85" numOctaves="3" stitchTiles="stitch"/>
      <feColorMatrix type="saturate" values="0"/>
    </filter>
    <!-- sylwetka: te same kształty co niżej (bez blasku i gwiazdek) -->
    <clipPath id="chest_toy">
      <path d="M40,140 C40,96 76,62 128,62 C180,62 216,96 216,140 Z"/>
      <circle cx="90" cy="108" r="18"/>
      <ellipse cx="128" cy="98" rx="30" ry="14" transform="rotate(-12 128 98)"/>
      <rect x="-22" y="-18" width="44" height="32" rx="4" transform="translate(168 108) rotate(8)"/>
      <ellipse cx="64" cy="126" rx="24" ry="11" transform="rotate(-20 64 126)"/>
      <path d="M58,140 C66,124 98,114 128,114 C158,114 190,124 198,140 Z"/>
      <rect x="36" y="136" width="184" height="92" rx="10"/>
      <rect x="33" y="133" width="24" height="24" rx="7"/>
      <rect x="199" y="133" width="24" height="24" rx="7"/>
      <rect x="33" y="205" width="24" height="24" rx="7"/>
      <rect x="199" y="205" width="24" height="24" rx="7"/>
      <rect x="110" y="130" width="36" height="36" rx="9"/>
      <circle cx="30" cy="222" r="9"/>
      <circle cx="226" cy="222" r="9"/>
    </clipPath>
  </defs>

  <!-- ===== szeroka poświata za wszystkim ===== -->
  <ellipse cx="128" cy="116" rx="100" ry="84" fill="url(#chest_halo)"/>

  <g stroke="#4A3226" stroke-width="3" stroke-linejoin="round" stroke-linecap="round">

    <!-- ===== wieko uchylone do tyłu: krawędź desek + ciemne wnętrze ===== -->
    <path d="M40,140 C40,96 76,62 128,62 C180,62 216,96 216,140 Z" fill="#C49363"/>
    <path d="M56,140 C56,108 86,80 128,80 C170,80 200,108 200,140 Z" fill="#8A5A3A"/>
    <!-- blik na krawędzi wieka -->
    <path d="M52,112 C60,90 84,72 110,69" fill="none" stroke="#FFFFFF" stroke-width="4" stroke-opacity="0.35"/>
    <!-- deski wnętrza wieka -->
    <path d="M68,140 C68,116 94,94 128,94 C162,94 188,116 188,140" fill="none" stroke="#5E3B24" stroke-width="2" stroke-opacity="0.6"/>
    <path d="M82,140 C82,124 102,108 128,108 C154,108 174,124 174,140" fill="none" stroke="#5E3B24" stroke-width="2" stroke-opacity="0.6"/>
    <!-- złote okucia wieka: pasek na szczycie, nakładki u nasady, ćwieki -->
    <rect x="117" y="61" width="22" height="20" rx="4" fill="#D9A440" stroke-width="2.4"/>
    <rect x="121" y="65" width="6" height="12" rx="3" fill="#F2C94C" stroke="none" opacity="0.9"/>
    <rect x="38" y="116" width="20" height="20" rx="5" fill="#D9A440" stroke-width="2.4"/>
    <rect x="198" y="116" width="20" height="20" rx="5" fill="#D9A440" stroke-width="2.4"/>
    <g fill="#4A3226" stroke="none" opacity="0.5">
      <circle cx="74" cy="90" r="2.2"/>
      <circle cx="96" cy="74" r="2.2"/>
      <circle cx="160" cy="74" r="2.2"/>
      <circle cx="182" cy="90" r="2.2"/>
    </g>
  </g>

  <!-- ===== rdzeń blasku w otworze (oświetla wnętrze wieka) ===== -->
  <ellipse cx="128" cy="118" rx="80" ry="46" fill="url(#chest_glow)"/>

  <g stroke="#4A3226" stroke-width="3" stroke-linejoin="round" stroke-linecap="round">

    <!-- ===== zabawki wysypujące się z otworu ===== -->
    <!-- różowy cukierek -->
    <g transform="translate(64 126) rotate(-20)">
      <path d="M-13,0 L-24,-9 q-2,9 0,18 Z" fill="#F9A8D4" stroke-width="2.4"/>
      <path d="M13,0 L24,-9 q2,9 0,18 Z" fill="#F9A8D4" stroke-width="2.4"/>
      <ellipse cx="0" cy="0" rx="14" ry="10" fill="#F06AB0"/>
      <path d="M-5,-9.5 q-3,9.5 0,19 M5,-9.5 q3,9.5 0,19" fill="none" stroke="#F9A8D4" stroke-width="3.5"/>
      <ellipse cx="0" cy="0" rx="14" ry="10" fill="none"/>
      <ellipse cx="-5" cy="-4.5" rx="4" ry="2.2" fill="#FFFFFF" stroke="none" opacity="0.6" transform="rotate(-25 -5 -4.5)"/>
    </g>
    <!-- czerwona piłka -->
    <circle cx="90" cy="108" r="18" fill="#E15240"/>
    <path d="M74,114 C78,124 100,126 106,114" fill="none" stroke="#C23F2F" stroke-width="3"/>
    <ellipse cx="83" cy="100" rx="6" ry="4" fill="#FFFFFF" stroke="none" opacity="0.6" transform="rotate(-30 83 100)"/>
    <!-- niebieski klocek -->
    <g transform="translate(168 108) rotate(8)">
      <rect x="-16" y="-18" width="12" height="8" rx="2" fill="#4A90D9" stroke-width="2.4"/>
      <rect x="4" y="-18" width="12" height="8" rx="2" fill="#4A90D9" stroke-width="2.4"/>
      <rect x="-22" y="-10" width="44" height="24" rx="4" fill="#4A90D9"/>
      <rect x="-17" y="-5" width="18" height="4" rx="2" fill="#FFFFFF" stroke="none" opacity="0.45"/>
    </g>
    <!-- pomarańczowy cukierek (jak znajdźka) -->
    <g transform="translate(128 98) rotate(-12)">
      <path d="M-18,0 L-30,-10 q-2,10 0,20 Z" fill="#FFD166" stroke-width="2.4"/>
      <path d="M18,0 L30,-10 q2,10 0,20 Z" fill="#FFD166" stroke-width="2.4"/>
      <ellipse cx="0" cy="0" rx="19" ry="13" fill="#F2913A"/>
      <path d="M-7,-12.5 q-4,12.5 0,25 M7,-12.5 q4,12.5 0,25" fill="none" stroke="#FFD166" stroke-width="4.5"/>
      <ellipse cx="0" cy="0" rx="19" ry="13" fill="none"/>
      <ellipse cx="-7" cy="-6" rx="5" ry="2.8" fill="#FFFFFF" stroke="none" opacity="0.6" transform="rotate(-25 -7 -6)"/>
    </g>

    <!-- ===== kopczyk złotych monet w otworze ===== -->
    <path d="M58,140 C66,124 98,114 128,114 C158,114 190,124 198,140 Z" fill="#D9A440"/>
    <g fill="#F2C94C" stroke-width="2.2">
      <circle cx="78" cy="131" r="8.5"/>
      <circle cx="98" cy="124" r="8.5"/>
      <circle cx="118" cy="120" r="8.5"/>
      <circle cx="140" cy="120" r="8.5"/>
      <circle cx="160" cy="124" r="8.5"/>
      <circle cx="180" cy="131" r="8.5"/>
    </g>
    <g fill="none" stroke="#D9A440" stroke-width="1.6">
      <circle cx="78" cy="131" r="4.5"/>
      <circle cx="98" cy="124" r="4.5"/>
      <circle cx="118" cy="120" r="4.5"/>
      <circle cx="140" cy="120" r="4.5"/>
      <circle cx="160" cy="124" r="4.5"/>
      <circle cx="180" cy="131" r="4.5"/>
    </g>

    <!-- ===== skrzynia ===== -->
    <rect x="36" y="136" width="184" height="92" rx="10" fill="#8A5A3A"/>
    <!-- deski -->
    <g fill="#C49363" stroke-width="2.2">
      <rect x="42" y="142" width="172" height="24" rx="5"/>
      <rect x="42" y="170" width="172" height="24" rx="5"/>
      <rect x="42" y="198" width="172" height="24" rx="5"/>
    </g>
    <!-- blik na górnej desce -->
    <path d="M48,147 C70,145 90,145 108,146" fill="none" stroke="#FFFFFF" stroke-width="3" stroke-opacity="0.35"/>
    <!-- słoje drewna -->
    <g fill="none" stroke="#8A5A3A" stroke-width="1.6" stroke-opacity="0.55">
      <path d="M90,154 C110,150 130,158 160,153"/>
      <path d="M46,183 C70,178 100,186 130,181 C150,178 170,186 196,182"/>
      <path d="M100,210 C120,206 140,214 170,209"/>
    </g>
    <!-- złote pasy -->
    <rect x="64" y="138" width="18" height="88" rx="5" fill="#D9A440" stroke-width="2.4"/>
    <rect x="174" y="138" width="18" height="88" rx="5" fill="#D9A440" stroke-width="2.4"/>
    <rect x="68" y="142" width="5" height="80" rx="2.5" fill="#F2C94C" stroke="none" opacity="0.9"/>
    <rect x="178" y="142" width="5" height="80" rx="2.5" fill="#F2C94C" stroke="none" opacity="0.9"/>
    <g fill="#4A3226" stroke="none" opacity="0.55">
      <circle cx="73" cy="150" r="2"/>
      <circle cx="73" cy="214" r="2"/>
      <circle cx="183" cy="150" r="2"/>
      <circle cx="183" cy="214" r="2"/>
    </g>
    <!-- narożne okucia -->
    <g fill="#D9A440" stroke-width="2.4">
      <rect x="33" y="133" width="24" height="24" rx="7"/>
      <rect x="199" y="133" width="24" height="24" rx="7"/>
      <rect x="33" y="205" width="24" height="24" rx="7"/>
      <rect x="199" y="205" width="24" height="24" rx="7"/>
    </g>
    <g fill="#F2C94C" stroke="none" opacity="0.9">
      <rect x="37" y="137" width="10" height="5" rx="2.5"/>
      <rect x="203" y="137" width="10" height="5" rx="2.5"/>
      <rect x="37" y="209" width="10" height="5" rx="2.5"/>
      <rect x="203" y="209" width="10" height="5" rx="2.5"/>
    </g>
    <!-- zamek z dziurką na klucz -->
    <rect x="110" y="130" width="36" height="36" rx="9" fill="#D9A440"/>
    <rect x="115" y="135" width="12" height="5" rx="2.5" fill="#F2C94C" stroke="none" opacity="0.9"/>
    <circle cx="128" cy="146" r="5" fill="#4A3226" stroke="none"/>
    <rect x="125" y="148" width="6" height="10" rx="2" fill="#4A3226" stroke="none"/>

    <!-- ===== monety, które wypadły obok ===== -->
    <circle cx="30" cy="222" r="9" fill="#F2C94C" stroke-width="2.4"/>
    <circle cx="226" cy="222" r="9" fill="#F2C94C" stroke-width="2.4"/>
    <circle cx="30" cy="222" r="4.8" fill="none" stroke="#D9A440" stroke-width="1.6"/>
    <circle cx="226" cy="222" r="4.8" fill="none" stroke="#D9A440" stroke-width="1.6"/>
  </g>

  <!-- ===== bryła i faktura (na wierzchu, przycięte do sylwetki) ===== -->
  <rect width="256" height="256" fill="url(#chest_shade)" clip-path="url(#chest_toy)"/>
  <rect width="256" height="256" filter="url(#chest_grain)" clip-path="url(#chest_toy)"
        opacity="0.14" style="mix-blend-mode:multiply"/>

  <!-- ===== gwiazdki blasku (bez konturu, jak fx_sparkle) ===== -->
  <g fill="#FFD166">
    <path d="M0,-1 C0.1,-0.3 0.3,-0.1 1,0 C0.3,0.1 0.1,0.3 0,1 C-0.1,0.3 -0.3,0.1 -1,0 C-0.3,-0.1 -0.1,-0.3 0,-1 Z" transform="translate(34 78) scale(13)"/>
    <path d="M0,-1 C0.1,-0.3 0.3,-0.1 1,0 C0.3,0.1 0.1,0.3 0,1 C-0.1,0.3 -0.3,0.1 -1,0 C-0.3,-0.1 -0.1,-0.3 0,-1 Z" transform="translate(222 70) scale(15)"/>
    <path d="M0,-1 C0.1,-0.3 0.3,-0.1 1,0 C0.3,0.1 0.1,0.3 0,1 C-0.1,0.3 -0.3,0.1 -1,0 C-0.3,-0.1 -0.1,-0.3 0,-1 Z" transform="translate(190 40) scale(9)"/>
    <path d="M0,-1 C0.1,-0.3 0.3,-0.1 1,0 C0.3,0.1 0.1,0.3 0,1 C-0.1,0.3 -0.3,0.1 -1,0 C-0.3,-0.1 -0.1,-0.3 0,-1 Z" transform="translate(68 44) scale(11)"/>
  </g>
  <g fill="#FFFFFF" opacity="0.85">
    <circle cx="34" cy="78" r="2.6"/>
    <circle cx="222" cy="70" r="3"/>
    <circle cx="190" cy="40" r="1.8"/>
    <circle cx="68" cy="44" r="2.2"/>
  </g>
  <g fill="#FFF2B2" opacity="0.9">
    <circle cx="52" cy="104" r="2.5"/>
    <circle cx="206" cy="100" r="2.5"/>
    <circle cx="104" cy="54" r="2.2"/>
    <circle cx="160" cy="52" r="2.2"/>
  </g>
</svg>
