<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 80 120" width="80" height="120">
  <!--
    Cyfra „6" licznika cukierków — jedyny „tekst" dopuszczony w grze (GDD sekcja 3).
    Gra pokazuje ją w 40×60 px w HUD, na granatowym nocnym tle.
    Rodzina ui_digit_0..9: wszystkie cyfry mają tę samą oś (x 18..62, y 15..103),
    tę samą grubość „rurki" i blik w tym samym miejscu — bez czcionki i bez elementu tekstowego:
    oś cyfry jest obrysowana grubą kreską konturu (28) i cieńszą kreską
    wypełnienia (16), więc kontur ma 6 jednostek (3 px w grze).
    Ziarno papieru przycięte maską z tej samej rurki (clipPath nie widzi obrysów).
    Pętla na dole, ogonek wygięty do góry w prawo.
    Paleta i grubości konturu: docs/Styleguide_Wektorowy.md
  -->
  <defs>
    <linearGradient id="ui_digit_6_fill" gradientUnits="userSpaceOnUse" x1="0" y1="8" x2="0" y2="112">
      <stop offset="0" stop-color="#F7F0E3"/>
      <stop offset="0.5" stop-color="#F7F0E3"/>
      <stop offset="1" stop-color="#EFD6B2"/>
    </linearGradient>
    <filter id="ui_digit_6_grain" x="0" y="0" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="3" stitchTiles="stitch"/>
      <feColorMatrix type="saturate" values="0"/>
    </filter>
    <mask id="ui_digit_6_body">
      <path d="M56,22 C51,17 46,15 40,15 C27,15 18,33 18,62 L18,77 C18,92 28,103 40,103 C52,103 62,92 62,77 C62,62 52,51 40,51 C28,51 18,60 18,77" fill="none" stroke="#FFFFFF" stroke-width="28" stroke-linecap="round" stroke-linejoin="round"/>
    </mask>
  </defs>

  <g fill="none" stroke-linecap="round" stroke-linejoin="round">
    <!-- miękki cień pod cyfrą — odrywa ją od nocnego tła -->
    <path d="M56,22 C51,17 46,15 40,15 C27,15 18,33 18,62 L18,77 C18,92 28,103 40,103 C52,103 62,92 62,77 C62,62 52,51 40,51 C28,51 18,60 18,77" stroke="#14284F" stroke-width="28" stroke-opacity="0.45" transform="translate(0 3)"/>
    <!-- kontur: cała rurka w kolorze konturu -->
    <path d="M56,22 C51,17 46,15 40,15 C27,15 18,33 18,62 L18,77 C18,92 28,103 40,103 C52,103 62,92 62,77 C62,62 52,51 40,51 C28,51 18,60 18,77" stroke="#4A3226" stroke-width="28"/>
    <!-- wypełnienie: cieńsza rurka, gradient koszulka → jasne futro ku dołowi -->
    <path d="M56,22 C51,17 46,15 40,15 C27,15 18,33 18,62 L18,77 C18,92 28,103 40,103 C52,103 62,92 62,77 C62,62 52,51 40,51 C28,51 18,60 18,77" stroke="url(#ui_digit_6_fill)" stroke-width="16"/>
    <!-- blik u góry -->
    <path d="M35,19 C38,15.5 42,14.5 47,16" stroke="#FFFFFF" stroke-width="3.6" stroke-opacity="0.65"/>
  </g>

  <!-- ziarno papieru — tylko na rurce -->
  <rect width="80" height="120" filter="url(#ui_digit_6_grain)" mask="url(#ui_digit_6_body)" opacity="0.12" style="mix-blend-mode:multiply"/>
</svg>
